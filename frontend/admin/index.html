<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Animal Lab — Instructor Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236366f1'/%3E%3Cg fill='white'%3E%3Ccircle cx='21' cy='23' r='6'/%3E%3Ccircle cx='32' cy='18' r='6'/%3E%3Ccircle cx='43' cy='23' r='6'/%3E%3Cpath d='M32 29c-8.5 0-15 6.4-15 12.4 0 4 3.2 6.6 7 6.6 3 0 5.6-1.6 8-1.6s5 1.6 8 1.6c3.8 0 7-2.6 7-6.6C47 35.4 40.5 29 32 29z'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="7.2" cy="8.6" r="2.1"/><circle cx="12" cy="6.6" r="2.1"/><circle cx="16.8" cy="8.6" r="2.1"/><path d="M12 11.2c-3.9 0-6.9 3-6.9 5.7 0 1.9 1.5 3.1 3.2 3.1 1.3 0 2.4-.8 3.7-.8s2.4.8 3.7.8c1.7 0 3.2-1.2 3.2-3.1 0-2.7-3-5.7-6.9-5.7z"/></svg>
        </span>
        <div class="brand-text">
          <strong>AI Animal Lab</strong>
          <span>Instructor Console</span>
        </div>
      </div>
      <nav class="topbar-actions">
        <a class="btn ghost" href="/dashboard">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7"/><path d="M2.5 20h19"/></svg>
          Live Statistics
        </a>
      </nav>
    </div>
  </header>

  <main class="wrap console-grid">
    <!-- Upload card -->
    <section class="card">
      <div class="card-head">
        <h2>Upload images</h2>
        <span class="hint">ground-truth labels for the labeling pool</span>
      </div>

      <label class="field-label" for="category">Category (instructor label)</label>
      <div class="select-wrap">
        <select id="category">
          <option value="" selected disabled>Loading…</option>
        </select>
      </div>
      <p id="category-msg" class="category-msg" hidden></p>

      <div id="dropzone" class="dropzone" tabindex="0" role="button"
           aria-label="Choose image files or drop them here">
        <span class="dz-icon" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M4 16.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5"/></svg>
        </span>
        <strong>Drop images here</strong>
        <span>or click to browse — JPG, PNG, WebP</span>
        <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
      </div>

      <p id="file-info" class="file-info" hidden></p>

      <button id="upload-btn" class="btn primary" type="button" disabled>
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M4 16.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5"/></svg>
        <span class="btn-label">Upload to lab</span>
      </button>

      <div id="upload-result" class="upload-result" hidden></div>
    </section>

    <!-- Catalog panel -->
    <section class="card">
      <div class="card-head">
        <h2>Image catalog</h2>
        <span id="catalog-total" class="pill">0 images</span>
      </div>

      <p id="catalog-msg" class="load-msg" hidden></p>
      <div id="counts-grid" class="counts-grid"></div>

      <h3 class="sub">Recent uploads</h3>
      <div id="preview-grid" class="preview-grid"></div>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
